spring:
  application:
    name: my-market-app-5
  profiles:
    active: dev
  web:
    cors:
      path-pattern: "/api/**"
      allowed-origin-patterns:
        - "http://localhost"
        - "http://127.0.0.1"
      allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

server:
  port: ${SPRING_DATASOURCE_SERVER_PORT:8080}