spring:
  main:
    allow-bean-definition-overriding: true

  r2dbc:
    pool:
      enabled: true

  security:
    oauth2:
      client:
        registration: {}
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/jwks

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false

logging:
  level:
    org:
      testcontainers: DEBUG
      org.springframework.security: INFO