spring:
  r2dbc:
    url: ${SPRING_DATASOURCE_URL:r2dbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_DB_PORT:5432}/${SPRING_DATASOURCE_DB_NAME:shop_db}}
    username: ${SPRING_DATASOURCE_DB_USERNAME:shop_admin}
    password: ${SPRING_DATASOURCE_DB_PASSWORD:shop_password}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30s
      max-life-time: 10m
      validation-query: SELECT 1

  liquibase:
    enabled: true
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_DB_PORT:5432}/${SPRING_DATASOURCE_DB_NAME:shop_db}
    user: ${SPRING_DATASOURCE_DB_USERNAME:shop_admin}
    password: ${SPRING_DATASOURCE_DB_PASSWORD:shop_password}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: dev

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: my-market-app
            client-secret: 90bd600c-7781-4435-961e-1f5139265f7c
            scope: openid, profile, email, roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:8082/realms/my-market-realm
            authorization-uri: http://localhost:8082/realms/my-market-realm/protocol/openid-connect/auth
            token-uri: http://localhost:8082/realms/my-market-realm/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8082/realms/my-market-realm/protocol/openid-connect/certs
            user-info-uri: http://localhost:8082/realms/my-market-realm/protocol/openid-connect/userinfo
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/realms/my-market-realm/protocol/openid-connect/certs