spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_DB_USERNAME}
    password: ${SPRING_DATASOURCE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

liquibase:
  enabled: true
  driver-class-name: org.postgresql.Driver
  url: ${SPRING_DATASOURCE_URL}
  username: ${SPRING_DATASOURCE_DB_USERNAME}
  password: ${SPRING_DATASOURCE_DB_PASSWORD}
  context: prod