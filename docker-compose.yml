services:
  store:
    container_name: store
    image: my-market/store:latest
    build:
      context: .
      dockerfile: store/Dockerfile
    env_file: ./env/.env
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - shop-network

  payment:
    container_name: payment
    image: my-market/payment:latest
    build:
      context: .
      dockerfile: payment/Dockerfile
    env_file: ./env/.env
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shop-network

  db:
    image: postgres:17-alpine
    container_name: shop-db
    restart: unless-stopped
    env_file: ./env/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - shop_db:/var/lib/postgresql/data
    networks:
      - shop-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: keycloak
    command: >
      start-dev --import-realm --http-port=8082 --http-enabled=true 
      --hostname-strict=false 
      --proxy-headers=xforwarded
    env_file: ./env/.env
    volumes:
      - ./env:/opt/keycloak/data/import
    networks:
      - shop-network
    healthcheck:
      test: [ "CMD-SHELL", "echo > /dev/tcp/localhost/8082" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - shop-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--url=unmanned-steelless-eliana.ngrok-free.dev"
      - "gateway:80"
    env_file: ./env/.env
    networks:
      - shop-network
    depends_on:
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started

  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: unless-stopped
    volumes:
      - ./env/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shop-network

volumes:
  shop_db:
  gradle_cache:

networks:
  shop-network:
    driver: bridge