services:

  store:
    container_name: store
    build:
      context: .
      dockerfile: store/Dockerfile
    env_file: ./env/.env
    depends_on:
      - payment
      - db
      - redis
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - shop-network
    volumes:
      - gradle_cache:/home/gradle/.gradle

  payment:
    container_name: payment
    build:
      context: .
      dockerfile: payment/Dockerfile
    env_file: ./env/.env
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - shop-network
    volumes:
      - gradle_cache:/home/gradle/.gradle

  db:
    image: postgres:17-alpine
    container_name: shop-db
    restart: unless-stopped
    env_file: ./env/.env
    ports:
      - "5432:5432"
    volumes:
      - shop_db:/var/lib/postgresql/data
    networks:
      - shop-network

  redis:
    image: redis:7.2.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - shop-network

volumes:
  shop_db:
  gradle_cache:

networks:
  shop-network:
    driver: bridge