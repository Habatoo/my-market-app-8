plugins {
    id 'java-platform'
    id 'maven-publish'
}

description = 'Bill of Materials for Gradle Blog Back Webapp'

javaPlatform {
    allowDependencies()
}

publishing {
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform
        }
    }
}

dependencies {
    constraints {

        api 'org.projectlombok:lombok:1.18.34'
        api 'org.springframework:spring-context:6.2.11'
        api 'org.springframework:spring-webmvc:6.2.11'

        api 'org.hibernate.orm:hibernate-core:7.1.6.Final'

        api 'org.mapstruct:mapstruct:1.6.3'
        api 'org.mapstruct:mapstruct-processor:1.6.3'
        api 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        api 'jakarta.servlet:jakarta.servlet-api:6.0.0'
        api 'jakarta.annotation:jakarta.annotation-api:2.1.1'
        api 'jakarta.validation:jakarta.validation-api:3.0.2'

        api 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'
        api 'org.openapitools:jackson-databind-nullable:0.2.4'

        api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
        api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

        api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

        api 'io.projectreactor:reactor-core:3.6.0'

        api 'com.zaxxer:HikariCP:5.1.0'
        api 'org.postgresql:postgresql:42.7.4'
        api 'org.postgresql:r2dbc-postgresql:1.1.1.RELEASE'
        api 'org.testcontainers:postgresql:1.21.3'

        api 'commons-fileupload:commons-fileupload:1.5'
        api 'commons-io:commons-io:2.16.1'

        api 'org.slf4j:slf4j-api:2.0.16'
        api 'ch.qos.logback:logback-classic:1.5.12'
        api 'org.slf4j:slf4j-simple:2.0.16'
    }
}